trigger: none

pool:
  vmImage: ubuntu-latest

parameters:
- name: DESTINATION_AWS_REGION
  displayName: Destination AWS Region
  type: string
  default: us-east-2

- name: DESTINATION_EKS_CLUSTER_NAME
  displayName: Destination EKS Cluster Name
  type: string
  default: dev-eks

- name: DESTINATION_EKS_CLUSTER_NAMESPACES
  displayName: Destination EKS Cluster Namespaces
  type: array
  default: ["dev", "staging"]

- name: DESTINATION_EKS_SECRET_NAME
  displayName: Destination EKS Secret Name
  type: string
  default: dev-eks-secret

- name: K8S_SERVICE_CONNECTION_NAME
  displayName: K8s Service Connection Name
  type: string
  default: dev-k8s-service-connection

variables:
  DESTINATION_AWS_REGION: ${{ parameters.DESTINATION_AWS_REGION }}
  DESTINATION_EKS_CLUSTER_NAME: ${{ parameters.DESTINATION_EKS_CLUSTER_NAME }}
  DESTINATION_EKS_CLUSTER_NAMESPACES: ${{ parameters.DESTINATION_EKS_CLUSTER_NAMESPACES }}
  DESTINATION_EKS_SECRET_NAME: ${{ parameters.DESTINATION_EKS_SECRET_NAME }}
  K8S_SERVICE_CONNECTION_NAME: ${{ parameters.K8S_SERVICE_CONNECTION_NAME }}

variables:
  - group: DR-Automation-Variables

stages:
- stage: Service_Connection_Creation
  jobs:
  - job: create_k8s_service_connection
 

    steps:
    # - script: |
    #     echo "Print All System Env Vars"
    #     printenv
    #   displayName: 'Print All  System Env Vars'

    - task: AWSShellScript@1
      displayName: Set kubectl Context for Destination EKS
      inputs:
        awsCredentials: 'AWS-ServiceConnection'
        regionName: '$(DESTINATION_AWS_REGION)'
        scriptType: inline
        inlineScript: |
          aws eks update-kubeconfig \
            --name $(DESTINATION_EKS_CLUSTER_NAME) \
            --region $(DESTINATION_AWS_REGION)
      continueOnError: false

    - task: AWSShellScript@1
      displayName: Get EKS Cluster URL
      inputs:
        awsCredentials: 'AWS-ServiceConnection'
        regionName: '$(DESTINATION_AWS_REGION)'
        scriptType: inline
        inlineScript: |
          CLUSTER_URL=$(aws eks describe-cluster \
            --region $(DESTINATION_AWS_REGION) \
            --name $(DESTINATION_EKS_CLUSTER_NAME) \
            --query 'cluster.endpoint' \
            --output text)

          echo "CLUSTER_URL: $CLUSTER_URL"
          echo "##vso[task.setvariable variable=CLUSTER_URL]$CLUSTER_URL"
      continueOnError: false

    - task: KubectlInstaller@0
      inputs:
        kubectlVersion: latest

    - script: |
        set -euo pipefail

        SECRET_NAMESPACE=$(echo '$(DESTINATION_EKS_CLUSTER_NAMESPACES)' | jq -r '.[0]')

        kubectl get secret $(DESTINATION_EKS_SECRET_NAME) \
          -n "$SECRET_NAMESPACE" \
          -o json > secret.json

        echo "secret.json created successfully"
        cat secret.json
      displayName: 'Get k8s Secret json'
      continueOnError: false

    - script: |
        echo "Install dependencies..."
        python3 -m pip install --upgrade pip
        python3 -m pip install --no-cache-dir -r requirements.txt
      displayName: 'Install dependencies'
      continueOnError: false

    - script: |
        echo "Run create_k8s_service_connection script..."
        python3 create_k8s_service_connection.py \
          --pat $(System.AccessToken) \
          --secret secret.json \
          --cluster-url $(CLUSTER_URL) \
          --name $(K8S_SERVICE_CONNECTION_NAME)
      displayName: 'Run create_k8s_service_connection script'

